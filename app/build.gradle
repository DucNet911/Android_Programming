plugins { id 'com.android.application' }
android {
    namespace 'com.example.arcade'
    compileSdk 35
    defaultConfig {
        minSdk 23
        applicationId 'com.example.arcade'
        targetSdk 35
        versionCode 2
        versionName '1.1.0-platform'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError = true }
}
dependencies {
    implementation project(':game_core')
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Depend on every library discovered under games/, without naming individual games.
rootProject.subprojects.findAll {
    it.projectDir.parentFile == rootProject.file('games')
}.sort { it.name }.each { module ->
    dependencies.add('implementation', project(module.path))
}

// Optional integration assertion: -PexpectedGameId=<id>.
tasks.withType(Test).configureEach {
    if (project.hasProperty('expectedGameId')) {
        systemProperty 'arcade.expectedGameId', project.property('expectedGameId')
    }
}
